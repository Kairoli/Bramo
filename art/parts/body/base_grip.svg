<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760">
  <!-- Corps de base des poses qui tiennent une arme : mêmes jambes, cou et tête que « base », mais des poings.
       Le poing éloigné est dessiné dans la pose du Forgefeu (il serre le manche en 332 214), puis ramené dans le repère de repos de l'os hand_far
       par la matrice inverse (calculée sur art/rig/poses/forgefire.json). -->
  <g id="shadow">
    <ellipse cx="226" cy="700" rx="118" ry="14" fill="#000" opacity=".45"/>
  </g>
  <g id="thigh_far">
    <path d="M214 330 L242 330 L246 558 L220 558 Z" fill="var(--c-legs-dark)"/>
  </g>
  <g id="shin_far">
    <path d="M219 550 L246 550 L250 668 L226 668 Z" fill="var(--c-legs-dark)"/>
  </g>
  <g id="thigh_near">
    <path d="M166 332 L202 332 L196 562 L168 562 Z" fill="var(--c-legs)"/>
  </g>
  <g id="shin_near">
    <path d="M167 554 L196 554 L191 672 L169 672 Z" fill="var(--c-legs)"/>
  </g>
  <g id="neck">
    <path d="M194 124 L222 128 L226 164 L192 164 Z" fill="var(--c-skin-dark)"/>
  </g>
  <g id="head">
    <path d="M186 100 Q188 72 212 68 Q236 70 240 92 L242 104 L250 113 L242 118 L240 128 Q236 142 222 150 Q200 148 190 130 Z" fill="var(--c-skin)"/>
    <path d="M186 100 Q188 72 212 68 L208 149 Q198 143 190 130 Z" fill="url(#rig-shade)"/>
  </g>
  <g id="hand_far">
    <g transform="matrix(0.9848 0.1736 -0.1736 0.9848 57.3613 -46.4738)">
      <g transform="translate(332 214) rotate(33)">
        <rect x="-15" y="-13" width="30" height="26" rx="8" fill="var(--c-skin)"/>
        <path d="M-5 -12 L-5 12 M4 -12 L4 12 M12 -10 L12 10" stroke="var(--c-skin-dark)" stroke-width="1.6" fill="none"/>
        <path d="M-14 -13 Q-4 -20 10 -14" stroke="var(--c-skin-dark)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <g id="hand_near">
    <path d="M125 366 Q119 386 129 397 L151 396 Q159 385 155 366 Z" fill="var(--c-skin)"/>
    <path d="M127 376 L154 375 M127 384 L154 383 M128 391 L152 390" stroke="var(--c-skin-dark)" stroke-width="1.5"/>
  </g>
</svg>
