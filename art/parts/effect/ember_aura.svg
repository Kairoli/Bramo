<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760">
  <!-- Effet de classe du Forgefeu : le sol se fend de chaleur sous ses bottes, des braises montent autour du marteau,
       et le poing de la hanche rougeoie comme un fer sorti du feu. Tout passe par la couleur d'affinité. -->
  <g id="cracks">
    <g class="fx-pulse" fill="none" stroke="var(--c-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#rig-glow)">
      <path d="M268 702 L292 708 L312 706 L330 712"/>
      <path d="M150 702 L130 708 L112 705 L96 711"/>
      <path d="M252 703 L260 714 L274 718"/>
      <path d="M164 703 L158 713 L146 716"/>
    </g>
  </g>
  <g id="heat">
    <ellipse cx="206" cy="692" rx="104" ry="24" fill="var(--c-glow)" opacity=".18" filter="url(#rig-soft)"/>
  </g>
  <g id="fist">
    <circle cx="140" cy="384" r="22" fill="var(--c-glow)" opacity=".22" filter="url(#rig-soft)"/>
    <path class="fx-pulse" d="M128 378 L153 377 M128 386 L153 385" stroke="var(--c-glow-light)" stroke-width="1.8" stroke-linecap="round" filter="url(#rig-glow)"/>
    <g class="fx-orbit">
      <circle cx="140" cy="384" r="26" fill="none"/>
      <circle cx="140" cy="358" r="1.8" fill="var(--c-glow-light)"/>
      <circle cx="165" cy="392" r="1.4" fill="var(--c-glow)"/>
      <circle cx="118" cy="398" r="1.4" fill="var(--c-glow)"/>
    </g>
  </g>
  <g id="embers">
    <g fill="var(--c-glow)" filter="url(#rig-glow)">
      <circle class="fx-rise" cx="118" cy="78" r="2" style="animation-delay: 0s"/>
      <circle class="fx-rise" cx="152" cy="70" r="1.6" style="animation-delay: .6s"/>
      <circle class="fx-rise" cx="136" cy="96" r="1.4" style="animation-delay: 1.3s"/>
      <circle class="fx-rise" cx="104" cy="92" r="1.8" style="animation-delay: 2s"/>
      <circle class="fx-rise" cx="250" cy="690" r="1.2" style="animation-delay: 2.6s"/>
      <circle class="fx-rise" cx="176" cy="694" r="1.6" style="animation-delay: 1.7s"/>
      <circle class="fx-rise" cx="146" cy="370" r="1.4" style="animation-delay: .9s"/>
      <circle class="fx-rise" cx="132" cy="374" r="1.2" style="animation-delay: 2.3s"/>
    </g>
  </g>
</svg>
