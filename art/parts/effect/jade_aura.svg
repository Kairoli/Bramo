<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760">
  <!-- Effet de classe du Traqueur : des pousses de jade percent le sol sous ses pieds, des feuilles dérivent autour de lui
       et la pointe de la flèche luit. Tout passe par la couleur d'affinité. -->
  <g id="sprouts">
    <g class="fx-pulse" fill="none" stroke="var(--c-glow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#rig-glow)">
      <path d="M96 704 Q106 694 102 682 M104 704 Q116 698 120 688"/>
      <path d="M272 704 Q284 696 280 684 M282 704 Q296 700 302 690"/>
      <path d="M186 708 Q190 698 184 690 M194 708 Q202 702 202 694"/>
      <path d="M232 710 Q240 700 236 690"/>
    </g>
  </g>
  <g id="glow">
    <ellipse cx="208" cy="694" rx="116" ry="22" fill="var(--c-glow)" opacity=".15" filter="url(#rig-soft)"/>
  </g>
  <g id="leaves">
    <g fill="var(--c-glow)" filter="url(#rig-glow)">
      <path class="fx-rise" d="M120 520 q4 -7 11 -5 q-4 7 -11 5z" style="animation-delay: 0s"/>
      <path class="fx-rise" d="M290 560 q4 -7 11 -5 q-4 7 -11 5z" style="animation-delay: .8s"/>
      <path class="fx-rise" d="M100 610 q4 -7 11 -5 q-4 7 -11 5z" style="animation-delay: 1.6s"/>
      <path class="fx-rise" d="M250 640 q4 -7 11 -5 q-4 7 -11 5z" style="animation-delay: 2.3s"/>
      <path class="fx-rise" d="M330 600 q4 -7 11 -5 q-4 7 -11 5z" style="animation-delay: 1.1s"/>
      <circle class="fx-rise" cx="170" cy="680" r="1.5" style="animation-delay: .4s"/>
      <circle class="fx-rise" cx="236" cy="676" r="1.3" style="animation-delay: 1.9s"/>
    </g>
  </g>
  <g id="tip">
    <g transform="matrix(0.887 -0.4617 0.4617 0.887 -132.0098 245.1001)">
      <circle cx="458" cy="196" r="11" fill="var(--c-glow)" opacity=".4" filter="url(#rig-soft)"/>
      <path class="fx-pulse" d="M446 196 L466 196 M456 189 L456 203" stroke="var(--c-glow-light)" stroke-width="1.6" stroke-linecap="round" filter="url(#rig-glow)"/>
    </g>
  </g>
</svg>
