    <path d="M194 88 Q210 74 238 78 Q254 84 252 98 L302 124 Q306 132 298 136 L250 122 Q240 126 222 122 Q204 118 196 110 Q190 100 194 88 Z" fill="url(#rig-sheen)"/>
    <path d="M226 82 l5 -6 l5 6 l-5 6 Z M212 84 l4 -5 l4 5 l-4 5 Z M240 86 l4 -4 l4 4 l-4 4 Z" fill="var(--c-mantle)"/>
    <path d="M198 108 Q206 116 222 118 Q238 118 246 110 M254 104 Q276 114 298 128" fill="none" stroke="var(--c-trim)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="219" cy="101" rx="7" ry="4.6" fill="#0B0D10"/><ellipse cx="237" cy="100" rx="4.6" ry="3.8" fill="#0B0D10"/>
    <path d="M231 72 l4 -7 l4 7 l-4 5 Z" fill="var(--c-trim)" class="fx-pulse" filter="url(#rig-glow)"/>
  </g>
  <g id="eyes">
