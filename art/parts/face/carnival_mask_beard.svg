<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760">
  <!-- Masque du Carnaval porté sur la barbe tressée du Forgefeu : le masque couvre le haut du visage, la barbe et sa bague restent visibles. -->
