  </g>
  <g id="features">
    <path d="M188 114 Q188 150 212 170 Q238 162 245 124 Q236 132 226 131 Q212 129 202 120 Z" fill="var(--c-beard)"/>
    <path d="M188 114 Q188 150 212 170 L210 128 Q202 124 198 118 Z" fill="url(#rig-shade)"/>
    <path d="M218 126 Q230 116 247 120 Q246 127 240 128 Q232 124 226 130 Z" fill="var(--c-beard)"/>
    <path d="M212 168 L214 190" fill="none" stroke="var(--c-beard)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="207" y="176" width="13" height="6" rx="2" fill="var(--c-metal)" transform="rotate(4 213 179)"/>
  </g>
  <g id="mask">
