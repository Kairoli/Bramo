<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760">
  <!-- Arc du Traqueur, tenu à bout de bras, corde à demi bandée, flèche encochée. Tout est dessiné dans la pose du Traqueur
       (poing en 435 203, encoche en 305 200), puis ramené dans le repère de repos de hand_far par la matrice inverse. -->
  <g id="bow">
    <g transform="matrix(0.887 -0.4617 0.4617 0.887 -132.0098 245.1001)">
      <path d="M408 34 Q446 120 436 188 L436 222 Q446 290 408 376" stroke="var(--c-wood)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M410 42 Q443 124 433 190 M433 220 Q443 288 410 368" stroke="var(--c-wood-light)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
      <rect x="430" y="188" width="12" height="34" rx="3" fill="var(--c-leather)"/>
      <path d="M430 196 L442 196 M430 205 L442 205 M430 214 L442 214" stroke="var(--c-trim)" stroke-width="1.8"/>
      <circle cx="408" cy="34" r="3.5" fill="var(--c-metal)"/>
      <circle cx="408" cy="376" r="3.5" fill="var(--c-metal)"/>
      <path d="M404 36 L412 36 M404 374 L412 374" stroke="var(--c-trim)" stroke-width="2"/>
    </g>
  </g>
  <g id="string">
