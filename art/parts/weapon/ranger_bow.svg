      <path d="M408 34 L305 200 L408 376" stroke="#E6DFC8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      <path d="M305 200 L458 196" stroke="var(--c-wood-light)" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M312 198.5 L458 194.8" stroke="#000" stroke-opacity=".25" stroke-width="1"/>
      <path d="M310 200 L322 190 L340 190 L331 199 Z M310 200 L322 210 L340 210 L331 201 Z" fill="var(--c-trim)"/>
      <path d="M311 200 L338 199 M316 195 L330 194.5" stroke="#000" stroke-opacity=".28" stroke-width="1"/>
      <path d="M441 190 L460 196 L441 202 Z" fill="var(--c-metal)"/>
      <path d="M441 190 L460 196" stroke="var(--c-glow-light)" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
