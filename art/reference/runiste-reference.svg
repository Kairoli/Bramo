<!-- Runiste, test de style du 20 octobre 2026 (tenue Cendres). Groupes = pièces ; classes CSS = animation de repos. -->
<svg viewBox="0 0 560 760" xmlns="http://www.w3.org/2000/svg" width="560" height="760" role="img" aria-label="Runiste, test de style" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>

.pc{transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
@keyframes breatheArm{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(2px) rotate(-1.5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
@keyframes sway{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-1.2deg)}}
.br{animation:breathe 3.2s ease-in-out infinite}
.brA{animation:breatheArm 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:262px 178px}
.sw{animation:sway 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
.hv{animation:hover 3.2s ease-in-out infinite}
.sp{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
.spb{animation:spinBack 9s linear infinite;transform-box:fill-box;transform-origin:center}
.orb{animation:spin 5s linear infinite;transform-box:view-box;transform-origin:342px 172px}
.pu{animation:pulse 2.4s ease-in-out infinite}
.rs{animation:rise 3.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.br,.brA,.sw,.hv,.sp,.spb,.orb,.pu,.rs{animation:none}}
</style>
<rect width="560" height="760" fill="#20262A"/>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<linearGradient id="shadeL" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="lightR" x1="0" x2="1"><stop offset=".45" stop-color="#B39DF5" stop-opacity="0"/><stop offset="1" stop-color="#B39DF5" stop-opacity=".22"/></linearGradient>
<linearGradient id="hoodSh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0D10" stop-opacity=".92"/><stop offset=".75" stop-color="#0B0D10" stop-opacity=".75"/><stop offset="1" stop-color="#0B0D10" stop-opacity="0"/></linearGradient>
</defs>

<g transform="translate(80 0)">
<!-- Sol -->
<ellipse cx="205" cy="700" rx="150" ry="22" fill="none" stroke="#B39DF5" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3 9"/>
<ellipse cx="205" cy="700" rx="104" ry="13" fill="#000" opacity=".45"/>
<ellipse cx="342" cy="172" rx="70" ry="70" fill="#B39DF5" opacity=".16" filter="url(#soft)"/>

<!-- Bâton -->
<g class="pc" style="transform: translate(0px, 0px)">
<path d="M121 112 L113 696" stroke="#4A3528" stroke-width="9" stroke-linecap="round"/>
<path d="M119 120 L112 690" stroke="#7A5A44" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
<path d="M121 118 Q104 84 118 56 Q130 34 124 14" fill="none" stroke="#4A3528" stroke-width="8" stroke-linecap="round"/>
<circle cx="128" cy="74" r="23" fill="none" stroke="#8C9497" stroke-width="5"/>
<circle cx="128" cy="74" r="23" fill="none" stroke="#F1F0EC" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="20 124"/>
<g class="hv"><polygon points="128,58 141,67 139,84 128,91 117,84 115,67" fill="#232A2E" stroke="#3C464A" stroke-width="1.5"/>
<path class="pu" d="M124 66 L132 74 L124 82 M132 66 L132 82" fill="none" stroke="#B39DF5" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/></g>
<path d="M117 300 l-6 10 l6 10 l6 -10z M116 300 L116 270" fill="#F08A4B" stroke="#F08A4B" stroke-width="1.5"/>
</g>

<!-- Arrière du manteau -->
