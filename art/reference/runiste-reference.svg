<g transform="rotate(6 232 330)"><rect x="226" y="314" width="13" height="20" rx="2" fill="#4A4F52"/><path d="M232 318 L232 330 M228 324 L236 324" stroke="#B39DF5" stroke-opacity=".8" stroke-width="1.5"/></g>
</g>

