<path d="M238 306 Q262 340 252 380 Q244 420 276 450 Q300 470 312 500 Q290 480 268 470 Q236 450 238 400 Q240 360 226 312 Z" fill="#F08A4B" opacity=".9"/>
</g>
</g>

