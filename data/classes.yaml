# Classes de base, ouvertes à tous et choisies dès la création. Le joueur en change quand il veut.
# (Combat en P4 : ici, seulement ce qui sert à l'affichage et au choix.)
# Chaque classe a sa tenue de départ et sa pose, pour qu'on voie tout de suite qui joue quoi.
# Les tenues cosmétiques se changent ensuite librement : elles suivent les os, donc toutes les poses.
# L'arme et l'effet sont dans la couleur d'affinité (--c-glow des pièces).

- id: runist
  name: Runiste
  style: magic
  profession: enchanting
  affinityColor: "#B39DF5"
  pitch: Grave des runes et les fait parler à distance. Foudre, sceaux et glyphes.
  startingOutfit: ashes
  pose: runist
  weapon: rune_staff
  effect: rune_circle

- id: forgefire
  name: Forgefeu
  style: melee
  profession: smithing
  affinityColor: "#F08A4B"   # proposition, à valider
  pitch: Frappe au corps à corps avec le marteau qu'il a forgé. Le métal chauffé à blanc est son arme.
  startingOutfit: embers
  pose: forgefire
  weapon: forge_hammer
  effect: ember_aura

- id: tracker
  name: Traqueur
  style: ranged
  profession: hunting
  affinityColor: "#7ED6A2"   # proposition, à valider
  pitch: Piste le gibier et tire de loin. Pièges, flèches et compagnons de meute.
  startingOutfit: thicket
  pose: tracker
  weapon: ranger_bow
  effect: jade_aura
