# Rencontres du jeu (docs/design/contenu/le-monde.md, butin-et-recettes.md ; adoptées le 22 octobre 2026).
# - profil : les six profils d'essai du banc (statistiques normalisées, P = 100, 2 800 PV : palier 20).
# - zone : les douze zones de la route (proposition zones-v2 de GPT, trois refaites par Claude : coherence-zones-v2).
# - gardien : les six gardiens de région (coherence-bosses-v1), deux familles de mécaniques chacun.
# tier = palier : les ennemis suivent la courbe d'équipement de ce palier (rules.gearStats.tiers : PV et dégâts × facteur
# du palier). circles = régions hautes : on choisit son cercle, du palier 40 à 90. loot = vestige de la région, objets nommés
# qu'on peut y trouver, ensembles dont les pièces y tombent (palier 40 et plus). Valeurs à équilibrer.
# attack = attaque ordinaire (ralentissable) ; charge, guard, regen, windows, erosion sont des phases à horaire fixe.
# Route du 23 octobre (mesure sim/src/wall.ts, set de départ au niveau du palier) : renforts et coups lourds adoucis, ils
# bloquaient tout le monde. Cour des trois coups ×6 -> ×5 ; Contremaître ×5 -> ×4 et un apprenti par vague au lieu de deux ;
# Vergers de verre et Régent : deux éclats par vague au lieu de trois, 45 de dégâts au lieu de 70 et 60. Notaire : marée basse
# 0,65 au lieu de 0,75 (Forgefeu et Runiste perdaient tout au niveau du palier). Plus tard la même nuit, avec le plancher à 75 %
# (simulation de serveur sur 90 jours) : Notaire et Gardien des trois portes −10 % (PV, coups, érosion, charges, garde), les deux
# murs où les joueurs restaient le plus longtemps. Avec un équipement Rare de son niveau, chaque gardien se passe à son palier.
