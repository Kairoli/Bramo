# Règles communes du combat automatique (dossier « Le cœur du jeu » v0.2, §3, §4, §7, §17).
# Les formes des règles sont dans packages/shared/src/combat/ ; ici, seulement leurs paramètres. Tout est à équilibrer.
# Unités : P = Puissance (coefficients), secondes pour les durées.

tick: 0.25                # pas de la simulation (s) ; l'horloge du moteur est en millisecondes entières
gcd: 1                    # deux compétences du même combattant sont espacées d'au moins 1 s
fightLimit: 240           # au-delà, la rencontre est perdue (« temps écoulé »)
# Ouverture du plan [Décidé par Louis, 22 octobre] : le build a un minuteur (sort 1 immédiat, sort 2 après 3 s…, 10 s au plus) ;
# une fois ce minuteur exécuté, les sorts partent en automatique selon leur cooldown.
#   sequence    : les répétitions attendent que chaque sort du plan ait été lancé une fois (règle retenue) ;
#   independent : chaque sort suit son cooldown dès son premier lancement (gardée pour comparer dans le simulateur).
opening: sequence
maxFirstUse: 10           # horaire de première utilisation maximal (s)
secondaryShare: 0.55      # part des dégâts et afflictions reçue par les cibles secondaires
firstBasicAt: 1           # première attaque de base
basicAttack:
  coefficient: 0.62       # dégâts de base = 0,62 P × intervalle de l'arme / referencePeriod
  referencePeriod: 2
weaponPeriods: {hammer: 2.4, sword_shield: 2, axe: 2, longbow: 2.2, crossbow: 2.4, daggers: 1.8, staff: 2.2, scepter: 2, grimoire: 2}
# Statistiques normalisées du banc, en attendant la conversion de l'équipement (étape 5).
referenceStats: {power: 100, maxHp: 2800, damageReduction: 0.25, critChance: 0.2, critMultiplier: 1.6, haste: 0.12}
caps:
  critChance: 0.5
  vulnerability: 0.1      # valeur active la plus forte, jamais la somme
  bossSlow: 0.15          # un boss n'est ralenti que sur ses attaques ordinaires, au plus de 15 %
  hardControl: 1.5        # étourdissement maximal d'un ennemi ordinaire (s)
  totalShield: 4.5        # boucliers simultanés sur un bénéficiaire (× P)
  secondaryShield: 1.6    # dont boucliers hors compétence (plaques, équipement) (× P)
  afflictionsPerType: 3   # Brûlures (ou Saignements) actives par cible, de sources différentes
enemy:
  onceWeakenTarget: heavy # les affaiblissements « une attaque » sont gardés pour le prochain coup lourd ou chargé
  defense: 0.10           # réduction uniforme ; aucune résistance élémentaire (reportées, décision de Louis du 22 octobre)
  firstAttackAt: 2        # première attaque ordinaire ; +0,5 s par ennemi suivant
  attackStagger: 0.5
  damageSpread: 0.10      # attaque ordinaire tirée entre 95 % et 105 %
stability:
  max: 80
  stunPressurePerSecond: 15   # un étourdissement sur boss devient de la Pression
  breakDuration: 6            # Rupture
  recovery: 8                 # pas de nouvelle Pression ni Rupture pendant ce délai
  breakDamageTaken: 0.08
  breakNextHitReduction: 0.25
  ordinaryMax: 50             # Stabilité d'un ennemi ordinaire (pas un boss) ; validé par Louis le 22 octobre
  ordinaryBreakStun: 2        # à sa Rupture, un ennemi ordinaire est étourdi 2 s (jamais un boss)
cleanse:
  auraImmunity: 6             # une purification protège de l'aura pendant 6 s
dotTick: 1

# Statistiques tirées de l'équipement porté (docs/design/coherence/coherence.md §3.2, proposition coherence-v2 adoptée le
# 22 octobre 2026). Les points du catalogue sont ramenés au palier 20 (`norm`), puis Puissance et PV suivent +12 % par palier
# (`factor`) : témoin palier 20 Rare mixte ≈ P 100, PV 2 800. La Défense encaisse aussi (1,5 PV par point). Les lignes
# aléatoires donnent une statistique, un modificateur de talent (`mod:`) ou un plafond de réserve (`pool:`).
gearStats:
  power: {base: 0, perPoint: 0.230}
  maxHp: {base: 1602, perPoint: 4.8, perDefense: 1.5}
  tiers: {"1": {norm: 4.69, factor: 0.797}, "10": {norm: 1.698, factor: 0.893}, "20": {norm: 1, factor: 1}, "30": {norm: 0.691, factor: 1.12}, "40": {norm: 0.534, factor: 1.254}, "50": {norm: 0.436, factor: 1.405}, "60": {norm: 0.368, factor: 1.574}, "70": {norm: 0.32, factor: 1.762}, "80": {norm: 0.282, factor: 1.974}, "90": {norm: 0.251, factor: 2.211}}
  defense: {cap: 0.45, k: {"1": 212}}
  haste: {cap: 0.23, base: 0.12, k: {"1": 200}}
  crit: {cap: 0.3, base: 0.05, k: {"1": 172}}
  critMultiplier: 1.6
  startShieldDuration: 8
  lines:
    Puissance: power
    Vitalité: maxHp
    Défense: damageReduction
    Cadence: haste
    Critique: critChance
    Dégâts critiques: critMultiplier
    Dégâts des afflictions: mod:dotDamage
    Durée des afflictions: mod:dotDuration
    Durée des ralentissements: mod:slowDuration
    Puissance des boucliers: mod:shieldPower
    Puissance des soins: mod:healPower
    Attaques de base: mod:basicDamage
    Compétences: mod:skillDamage
    Pression: mod:pressure
    Dépenses de réserve: mod:spendPower
    Tisons au plafond: pool:tisons
    Entailles au plafond: pool:entailles
    Frimas au plafond: pool:frimas
    Rancœur au plafond: pool:rancoeur
    Ferveur au plafond: pool:ferveur
    Mesure au plafond: pool:mesure
    Échos au plafond: pool:echos
    Trophées au plafond: pool:trophees

# Butin d'une victoire (docs/design/contenu/butin-et-recettes.md §2), compté en unités de 6 minutes de combat : un combat de
# 36 s vaut 0,1 unité. Pas de matière première (c'est le travail des métiers) ni d'or neuf. À équilibrer.
loot:
  unitSeconds: 360
  vestiges: 2             # vestiges de la région par unité
  classic: 0.20           # chance d'un objet classique du palier par unité
  rarity: {common: 0.55, rare: 0.30, epic: 0.13, legendary: 0.02}
  setPiece: 0.04          # chance d'une pièce d'ensemble par unité (palier 40 et plus)
  setLegendary: 0.10
  named: 0.05             # chance par objet nommé de la rencontre, par unité
  namedGuarantee: 20      # garanti après 20 unités sans l'avoir eu

# Progression de classe et activité de combat (étape 4). [Décidé par Louis : XP de classe au combat seulement ;
# Terrain d'entraînement validé.] Chiffres proposés par Claude, à équilibrer.
progression:
  xpPerHour: 400          # XP de classe par heure de combat crédité au niveau 1 : R(L) = 400 × 2^((L−1)/55), comme les métiers
  xpDoubling: 55
  catchUpBonus: 0.5       # +50 % pour une classe sous 80 % du niveau de la meilleure classe du personnage
  catchUpBelow: 0.8
  rest: 5                 # repos fixe entre deux rencontres (s), non crédité
  lossXpShare: 0.5        # une défaite crédite la moitié de son temps
  maxConsecutiveLosses: 3 # puis l'activité se met en pause (rien n'est perdu)
  training:               # Terrain d'entraînement : sans butin ni risque
    xpShare: 0.4
    maxLevel: 40
