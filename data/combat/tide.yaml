# La Marée du soir (docs/design/contenu/le-monde.md §5). [Décidé par Louis le 22 octobre : tous les soirs à 20 h pendant une
# heure ; le type tourne chaque soir.] Le reste est proposé par Claude (23 octobre, nuit), chiffres à équilibrer.
#
# - Chaque participant marque des points : en combat, sa contribution face à la Marée ramenée à celle d'un build moyen de
#   son niveau (un build moyen fait 1 point par minute, soit 60 points le soir) ; ou en travail, ce que la digue demande.
# - Inscription de 19 h à 20 h [Décidé par Louis, 23 octobre : plus d'inscription automatique, « ça évite que quelqu'un
#   choppe des récompenses sans jamais voir à quoi ressemble le combat »] ; un personnage inscrit combat même déconnecté.
# - Le joueur connecté pendant la Marée marque un peu plus (+15 %), jamais de quoi faire plus de 2 à 2,5 fois un casu.
# - Les éclats de marée ne donnent que des apparences ; le coffre de la semaine, des matières et une chance de cache.
startHour: 20             # 20 h à Paris, heure d'été comme d'hiver
timeZone: Europe/Paris
durationMin: 60
registrationMin: 60       # les inscriptions ouvrent une heure avant (19 h)
rotation: [debacle, lanterns, giants]
tides:
  - id: debacle
    name: La Débâcle
    blurb: "La digue du Fossé gris a cédé : tout ce que la Marée avait pris descend la rivière."
    scoring: damage
    encounter: tide_debacle
    shines: "les dégâts, surtout de zone"
    work: { text: "Consolider la digue : pierre et planches.", items: [{ item: stone_block, qty: 300 }, { item: pine_plank, qty: 120 }] }
  - id: lanterns
    name: La Nuit des Lanternes
    blurb: "Les lanternes de la Chaussée marchent vers le bourg ; derrière chacune, une âme qui rentre."
    scoring: support
    encounter: tide_lanterns
    shines: "les soutiens et le contrôle : soigner, protéger, affaiblir"
    work: { text: "Fabriquer des lanternes : fioles et bois.", items: [{ item: vial, qty: 240 }, { item: pine_log, qty: 200 }] }
  - id: giants
    name: La Veille des Géants
    blurb: "Un géant sort de la brume."
    scoring: damage
    encounter: tide_giants
    shines: "les gros dégâts, et ceux qui tiennent"
    work: { text: "Poser des balises : relevés et rivets.", items: [{ item: survey_notes, qty: 300 }, { item: rivets, qty: 200 }] }
points:
  perMinute: 1
  minRatio: 0.4           # un débutant marque au moins 40 % d'un build moyen : personne ne repart les mains vides
  maxRatio: 2
  liveBonus: 0.15
  # Canal travail (23 octobre) : à 1, livrer valait moins que combattre et personne ne le choisissait au simulateur. À 1,4,
  # tout livrer vaut un bon combattant : récolteurs et artisans y portent leurs matières chaque soir (un débouché de plus).
  workMultiplier: 1.4
  referenceShare: 1       # le build moyen : un équipement Rare complet de son niveau (à 75 %, la moyenne marquait 90 points au lieu de 60)
  supportWeight: 2        # Nuit des Lanternes : soigner, protéger, affaiblir comptent double
  fights: 3
shards:
  item: tide_shard
  perPoint: 0.5           # ~50 éclats un soir moyen, seuils compris : à 1 par point, 790 par semaine, trop
  objectivePerParticipant: 55
  thresholds: [{ share: 0.25, bonus: 2 }, { share: 0.5, bonus: 3 }, { share: 0.75, bonus: 4 }, { share: 1, bonus: 6 }]
weekly:
  bestNights: 4
  materialsMinutes: 40
  cacheChance: 0.25
  bonusAbove: 200
  bonusShards: 20
# ~1 200 éclats : un peu plus de trois semaines de soirs (mesuré au simulateur : ~360 éclats par semaine). Une tenue par classe.
shop:
  - { id: high_tide_runist, name: "Marée haute (Runiste)", outfit: high_tide, cost: 1200 }
  - { id: high_tide_forge, name: "Marée haute (Forgefeu)", outfit: high_tide_forge, cost: 1200 }
  - { id: high_tide_ranger, name: "Marée haute (Traqueur)", outfit: high_tide_ranger, cost: 1200 }
titles:
  - { tide: debacle, nights: 10, title: "A tenu la digue" }
  - { tide: lanterns, nights: 10, title: "Porte-lanterne" }
  - { tide: giants, nights: 10, title: "A vu un géant" }
# Mécène de la Marée [Décidé par Louis, 23 octobre : « surtout le 1 », avec des titres selon le nombre de soirs offerts].
# Un joueur offre la Marée du soir au serveur : son or est détruit (le puits d'or qui vise ceux qui en ont trop), et tous les
# participants de ce soir ont +10 % d'éclats par mécène (trois au plus). Son nom s'affiche à la Marée, au bourg et au fil.
# Prix : 250 or par participant du dernier soir (~28 000 or pour 113 participants), au moins 5 000. Chiffres à équilibrer.
patron:
  perParticipant: 250
  minPrice: 5000
  maxPerNight: 3
  shardBonus: 0.1
  titles:
    - { offered: 1, title: "Mécène d'un soir" }
    - { offered: 5, title: "Ami de la digue" }
    - { offered: 15, title: "Bienfaiteur des Marées" }
    - { offered: 40, title: "Lanterne du bourg" }
    - { offered: 100, title: "Grand Mécène de la Marée" }
