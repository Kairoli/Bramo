  # Une version par classe [Louis : « reconnaître les classes hors pose »] : le Forgefeu garde son visage, sa barbe tressée
  # et ses avant-bras nus ; le Runiste sa capuche profonde et sa robe longue ; le Traqueur son capuchon, son carquois et
  # sa cape courte. `parts` = la version du Runiste ; `byClass` donne celles des deux autres classes.
  - id: sketch_season_frost
    name: Sentinelle du Givre
    subtitle: Essai de saison (Givre)
    classes: [runist, forgefire, tracker]
    palette:
