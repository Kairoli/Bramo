# Commandes PNJ du Comptoir de la guilde. Le PNJ n'achète pas à la demande : chaque joueur reçoit chaque jour
# `settings.npcOrders.perDay` commandes, tirées pour lui parmi des métiers au hasard, en s'adaptant à son niveau dans
# chacun (une commande n'est proposée que si `level` ≤ son niveau ; on tire parmi les trois plus hautes accessibles).
# Un joueur haut en Minage mais niveau 1 en Pêche reçoit donc une commande de pêche de niveau 1.
# Généré par un script de calibrage puis ajusté à la main : récolte = 15 min de travail à 10 or la minute × 2^((L−1)/55),
# puis ×0,75 le 21 octobre (équilibre de l'or : `pnpm --filter @bramo/sim sim balance`, docs/design/marche.md §9), puis ×0,7 le
# 23 octobre (simulation de serveur : le Comptoir créait 82 % de l'or, deux fois ce qui en sortait, et payait les matières
# premières quatre fois leur prix au marché), puis ×2 le 23 octobre [Décidé par Louis : une économie active, « ça me dérange pas que
# certains aient beaucoup d'or » ; au simulateur, ×2 fait acheter deux fois plus d'unités au marché sans faire monter les prix]. # à équilibrer

