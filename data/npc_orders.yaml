# Commandes PNJ du Comptoir de la guilde. Le PNJ n'achète pas à la demande : chaque joueur reçoit chaque jour
# `settings.npcOrders.perDay` commandes, tirées pour lui parmi des métiers au hasard, en s'adaptant à son niveau dans
# chacun (une commande n'est proposée que si `level` ≤ son niveau ; on tire parmi les trois plus hautes accessibles).
# Un joueur haut en Minage mais niveau 1 en Pêche reçoit donc une commande de pêche de niveau 1.
# Généré par un script de calibrage puis ajusté à la main : récolte = 15 min de travail à 10 or la minute × 2^((L−1)/55). # à équilibrer

