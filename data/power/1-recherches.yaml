# Les Recherches de la Guilde (la technologie de Legend of Mushroom) : le cabinet des savants de la halle. Un arbre en trois
# branches ; chaque niveau se paie en or et en matières des métiers (un vrai débouché pour les artisans et les récolteurs) et
# prend du temps : la recherche tourne pendant qu'on joue, ou pas. Une recherche à la fois. Chiffres à équilibrer.
# Ordre de grandeur voulu : tout l'arbre en 4 à 6 mois, environ 1,5 palier de force au bout (mesuré : sim/src/tempo/force.ts).
# Recalé le 24 octobre (nuit) après la simulation de serveur : durées × 2,5 (l'arbre entier : ~130 jours de cabinet), or × 2 ;
# avant, un casu gagnait 2,9 paliers en trois mois et la route devenait trop simple (docs/design/puissance.md §8).
# Rendements décroissants : chaque niveau coûte plus cher (or ×1,25, matières ×1,15) et plus long (×1,3) que le précédent,
# pour le même gain ; le temps, le même pour tous, borne ce que l'or permet d'aller chercher.
id: recherches
name: Les Recherches de la Guilde
kind: research
text: "Les savants de la Guilde étudient ce que la Marée rapporte. Chaque découverte rend un peu plus fort."
unlock: {classLevel: 5}
slots: 1
