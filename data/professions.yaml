# Métiers (docs/design/metiers.md). status: soon = visible mais pas encore jouable.
# Les 17 métiers sont jouables (les dix derniers branchés le 23 octobre 2026 : recettes de la proposition boucle-v0,
# complétées ; Artificerie et Exploration écrites par Claude). Recettes, durées et quantités à équilibrer.

# --- Récolte ---
- id: mining
  name: Minage
  nickname: Gratte-sol
  family: gathering
  status: playable
  place: Mines des Monts de Brisefer
  description: Minerais, pierre, sable et gemmes brutes.
  master: { name: Maître Orvald, line: "« Une bonne pioche vaut dix bras. Reviens quand tu sauras lire la roche. »" }
  categories:
    - { id: ores, name: Minerais }
    - { id: stone, name: Pierre et sable }
    - { id: gems, name: Gemmes }

- id: woodcutting
  name: Bûcheronnage
  nickname: Ramasseur de brindilles
  family: gathering
  status: playable
  place: Bois des Murmures
  description: Bois d'œuvre et écorce (tanin).
  master: { name: Maîtresse Aldra, line: "« L'écorce, garde-la : les tanneurs paient. »" }
  categories:
    - { id: logs, name: Bois }

- id: fishing
  name: Pêche
  nickname: Lanceur de lignes
  family: gathering
  status: playable
  place: Mer des Lanternes
  description: Poissons, coquillages et perles.
  master: { name: Maître Naël, line: "« La mer ne se presse pas. Toi non plus, mais tu peux ramer. »" }
  categories:
    - { id: fish, name: Poissons }

- id: herbalism
  name: Herboristerie
  nickname: Cueilleur de pissenlits
  family: gathering
  status: playable
  place: Jardins des Brumes
  description: Herbes sauvages, racines et fleurs rares.
  master: { name: Maîtresse Ysolde, line: "« Cueille à l'aube, jamais à midi. La sauge, elle, s'en moque. »" }
  categories:
    - { id: herbs, name: Herbes }

- id: hunting
  name: Chasse
  nickname: Pisteur du dimanche
  family: gathering
  status: playable
  place: Landes du Nord
  description: Peaux, viandes, plumes et trophées.
  master: { name: Maîtresse Brenna, line: "« Une bête, ça se lit avant de se chasser. Les traces ne mentent jamais, les chasseurs si. »" }
  categories:
    - { id: game, name: Gibier }

- id: agriculture
  name: Agriculture
  nickname: Gratte-sillon
  family: gathering
  status: playable
  place: Terrasses du Val
  description: Lin, blé, légumes et plantes tinctoriales, puis leur préparation (filasse, farine, teinture).
  master: { name: Maître Anselme, line: "« La terre rend ce qu'on lui donne. Un peu moins les années de grêle. »" }
  categories:
    - { id: fields, name: Cultures }
    - { id: processing, name: Préparation }

# --- Artisanat ---
- id: smithing
  name: Forge
  nickname: Souffleur de braises
  family: crafting
  status: playable
  place: Forge du campement
  description: Fonte des métaux communs, outils de tous les métiers, armes et armures de métal.
  master: { name: Maître Brunhild, line: "« Tout le monde a besoin d'un forgeron. Même ceux qui l'ignorent. »" }
  categories:
    - { id: bars, name: Fonte }
    - { id: tool_parts, name: Fers d'outils }
    - { id: tools, name: Outils }
    - { id: hardware, name: Quincaillerie }
    - { id: weapons, name: Armes }

- id: carpentry
  name: Menuiserie
  nickname: Aligneur de planches
  family: crafting
  status: playable
  place: Atelier du campement
  description: Planches, manches, arcs, flèches et bois de charpente.
  master: { name: Maître Joris, line: "« Un manche mal taillé, et la meilleure lame ne vaut rien. »" }
  categories:
    - { id: planks, name: Planches }
    - { id: handles, name: Manches }
    - { id: archery, name: Archerie }

- id: tanning
  name: Tannerie
  nickname: Racleur de peaux
  family: crafting
  status: playable
  place: Fosses du tanneur
  description: Tanner les peaux et travailler le cuir.
  master: { name: Maître Hugon, line: "« Ça sent mauvais, oui. Le bon cuir sent toujours mauvais avant de sentir bon. »" }
  categories:
    - { id: tanning, name: Tannage }
    - { id: leather_goods, name: Cuir ouvré }

- id: tailoring
  name: Couture
  nickname: Enfileur d'aiguilles
  family: crafting
  status: playable
  place: Atelier du campement
  description: Filer, tisser, teindre et coudre les vêtements.
  master: { name: Maîtresse Lise, line: "« Un point droit, puis un autre. La patience, c'est juste beaucoup de points droits. »" }
  categories:
    - { id: spinning, name: Fil et toile }
    - { id: garments, name: Vêtements }

- id: cooking
  name: Cuisine
  nickname: Éplucheur de légumes
  family: crafting
  status: playable
  place: Cuisines du campement
  description: Repas longs qui accélèrent le travail, provisions et vivres de combat.
  master: { name: Maître Bertin, line: "« Un bon repas, et la journée file deux fois plus vite. Bon, presque. »" }
  categories:
    - { id: dishes, name: Plats }

- id: alchemy
  name: Alchimie
  nickname: Touilleur de chaudrons
  family: crafting
  status: playable
  place: Laboratoire
  description: Fioles, potions, élixirs et réactifs.
  master: { name: Maître Évariste, line: "« Si ça fume vert, recule. Si ça fume violet, cours. Si ça ne fume pas, recommence. »" }
  categories:
    - { id: glass, name: Verrerie }
    - { id: potions, name: Potions }
    - { id: reagents, name: Réactifs }

- id: jewelcrafting
  name: Joaillerie
  nickname: Polisseur de cailloux
  family: crafting
  status: playable
  place: Comptoir du lapidaire
  master: { name: Maîtresse Sidonie, line: "« Toute pierre est belle. Il suffit d'enlever ce qui ne l'est pas. »" }
  description: Affiner l'argent et l'or, tailler les gemmes, sertir anneaux et amulettes.
  categories:
    - { id: refining, name: Affinage }
    - { id: cutting, name: Taille }
    - { id: jewelry, name: Bijoux }

- id: enchanting
  name: Enchantement
  nickname: Gribouilleur de runes
  family: crafting
  status: playable
  place: Cercle des runes
  description: Graver des runes, lier des noyaux et runer les vêtements.
  master: { name: Maître Ilian, line: "« Une rune mal tracée ne fait rien. Une rune presque bien tracée, c'est pire. »" }
  categories:
    - { id: runes, name: Runes }
    - { id: enchant, name: Enchantements }

- id: artificing
  name: Artificerie
  nickname: Tourneur de vis
  family: crafting
  status: playable
  place: Atelier des artificiers
  description: Mécanismes, pièges, poudres et engins.
  master: { name: Maîtresse Capucine, line: "« Tout ce qui tourne peut tourner mieux. Tout ce qui explose aussi, mais ailleurs. »" }
  categories:
    - { id: mechanisms, name: Mécanismes }
    - { id: powders, name: Poudres }
    - { id: devices, name: Engins }

# --- Monde et clan ---
- id: construction
  name: Construction
  nickname: Porteur de moellons
  family: world
  status: playable
  place: Chantiers
  description: Éléments de charpente et de maçonnerie, posés dans l'atelier personnel et la halle du clan.
  master: { name: Maître Gautier, line: "« Un mur droit, c'est un mur qui n'a pas d'histoire. Fais-moi des murs sans histoire. »" }
  categories:
    - { id: materials, name: Matériaux }
    - { id: elements, name: Éléments }

- id: exploration
  name: Exploration
  nickname: Promeneur du dimanche
  family: world
  status: playable
  place: Carte du monde
  description: Expéditions qui rapportent des cartes de gisement, des curiosités et des sites.
  master: { name: Maîtresse Ombeline, line: "« Une carte, c'est une promesse. Le terrain, lui, n'a rien promis. »" }
  categories:
    - { id: expeditions, name: Expéditions }
