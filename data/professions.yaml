# Les 14 métiers du lancement. status: soon = visible mais pas encore jouable.

# --- Récolte ---
- id: mining
  name: Minage
  family: gathering
  status: playable
  place: Mines des Monts de Brisefer
  description: Extraire le minerai des galeries.
  master: { name: Maître Orvald, line: "« Une bonne pioche vaut dix bras. Reviens quand tu sauras lire la roche. »" }
  categories:
    - { id: ores, name: Minerais }

- id: woodcutting
  name: Bûcheronnage
  family: gathering
  status: soon
  place: Bois des Murmures
  description: Abattre et débiter le bois.

- id: fishing
  name: Pêche
  family: gathering
  status: soon
  place: Mer des Lanternes
  description: Pêcher en mer et en rivière.

- id: herbalism
  name: Herboristerie
  family: gathering
  status: playable
  place: Jardins des Brumes
  description: Cueillir herbes, racines et fleurs rares.
  master: { name: Maîtresse Ysolde, line: "« Cueille à l'aube, jamais à midi. La sauge, elle, s'en moque. »" }
  categories:
    - { id: herbs, name: Herbes }

- id: hunting
  name: Chasse
  family: gathering
  status: soon
  place: Landes du Nord
  description: Traquer le gibier, rapporter cuirs et viandes.

