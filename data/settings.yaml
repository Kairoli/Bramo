# Réglages globaux de Bramo. Aucun de ces chiffres ne doit apparaître dans le code.

xp:
  maxLevel: 99

# Rangs de métier (docs/design/rangs.md) : à ces niveaux, le maître du métier propose une commande spéciale (data/trials.yaml).
# La réussir accorde le surnom du palier et débloque la tranche suivante ; sans elle, le niveau reste au palier
# (l'XP continue de s'accumuler et se débloque à la validation : rien n'est perdu).
ranks:
  levels: [20, 40, 60, 80, 99]

activity:
  queueLength: 3          # actions en file après l'activité en cours (abonnés : à décider)
  maxQuantity: 10000      # quantité maximale par lancement

presence:
  activeTimeoutSec: 120   # sans signe de vie depuis ce délai, le joueur passe hors ligne
  heartbeatSec: 30        # fréquence des signes de vie du client

# Rendement unique (décision du 21 octobre) : 100 % en ligne comme hors ligne,
# pendant 16 h d'autonomie après la dernière visite. Au-delà, l'activité attend ; rien n'est perdu.
rates:
  active: 1.0
  offline: 1.0
  offlineCapHours: 16

# Coups de fouet : le joueur les active quand il veut, en ligne comme hors ligne.
energy:
  multiplier: 1.5         # à équilibrer
  charges: 2              # par jour de jeu
  durationMin: 30
  resetHourUtc: 4         # bascule du jour de jeu (4 h UTC = 5 h ou 6 h à Paris)

# Plafond de chaque source de bonus (0.30 = +30 %).
bonusCaps:
  tool: 0.30
  meal: 0.10
  clan: 0.10
  season: 0.20

# Usure : un outil usé ne donne plus son bonus mais n'est jamais perdu ; réparer rend toute la durabilité.
wear:
  repairGoldShare: 0.5    # coût PNJ = 50 % de la valeur de l'objet, au prorata de l'usure ; à équilibrer
  recycleShare: 0.4       # part des matériaux principaux rendue, arrondie vers le bas
  repairXpShare: 0.5      # XP d'une réparation par matériaux : part de l'XP de la recette de l'objet

# Prime de commande : livrer un ordre d'achat d'un objet qu'on sait fabriquer rapporte un peu d'XP en plus,
# plafonné par jour pour que des échanges de complaisance entre deux comptes ne servent à rien.
commissions:
  primeShare: 0.2         # +20 % de l'XP de la recette ; à équilibrer
  primeUnitsPerDay: 100   # unités concernées par jour de jeu

# Marché entre joueurs (décision du 21 octobre : pas de PNJ qui rachète ; le PNJ ne passe que des commandes).
market:
  taxShare: 0.05          # prélevée sur le produit de chaque vente, détruite (puits d'or)
  maxOpenOrders: 20       # ordres ouverts par joueur
  maxPrice: 10000000      # prix unitaire maximal
  maxQuantity: 10000      # quantité maximale par ordre

# Comptoir de la guilde : commandes PNJ du jour (data/npc_orders.yaml), les mêmes pour tous, une fois chacune.
npcOrders:
  perDay: 3

# Clans (docs/design/monde.md §3) : le projet « bonus de clan » se finance en or ; chaque niveau donne +2 % à tous les membres.
clan:
  creationCost: 500       # or ; à équilibrer
  nameMin: 3
  nameMax: 24
  maxMembers: 30
  minMembersForCost: 3    # un petit clan bâtit aussi vite par tête qu'un grand
  levelCostPerMember: 500 # niveau N = N × 500 or × membres actifs (14 jours, au moins 3) ; à équilibrer
  maxLevel: 5             # +10 % au niveau 5 (plafond bonusCaps.clan)
  bonusPerLevel: 0.02
  townGuildBonus: 0.03    # Guilde du bourg : bonus de qui n'a pas de clan
  warehouseKinds: 60
  logSize: 30
  activeDays: 14

# Bourg (accueil) : qui on voit passer, ce que le fil du serveur annonce.
town:
  activeWindowMin: 15     # un joueur vu depuis moins de 15 min passe dans la scène
  maxWalkers: 10
  feedSize: 30
  milestoneLevels: [20, 40, 60, 80, 99]   # niveaux de métier annoncés au serveur

absence:
  minSummaryMin: 5        # en dessous, pas de fenêtre de résumé à la connexion

character:
  startingGold: 100       # à équilibrer
