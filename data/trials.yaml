    - { item: ash_log, qty: 55 }
  reward: { gold: 300 }

- id: woodcutting_40
  profession: woodcutting
  rank: 40
  name: "Les querelles du bûcheron"
  nickname: "Fendeur de querelles"
  intro: "« Les voisins se disputent la parcelle d’if. Trancher à la hache, c’est plus rapide que le tribunal. »"
  outro: "Les voisins se sont réconciliés pour t’en vouloir ensemble. La paix est revenue."
  tasks:
    - { item: yew_log, qty: 150 }
    - { item: moonwood_log, qty: 135 }
  reward: { gold: 800 }

