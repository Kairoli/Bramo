    - { item: umbral_ore, qty: 580 }
  reward: { gold: 45000 }

- id: mining_99
  profession: mining
  rank: 99
  name: "Le cœur de la montagne"
  nickname: "Cœur de la montagne"
  intro: "« Dernière commande. Je ne dirai pas ce que la montagne y gagne. Apporte-lui de l’astralite. »"
  outro: "La montagne a eu un petit tremblement de satisfaction. Orvald a pleuré, discrètement, dans un seau."
  tasks:
