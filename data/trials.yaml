- id: mining_40
  profession: mining
  rank: 40
  name: "Le filon qui chuchote"
  nickname: "Chuchoteur de filons"
  intro: "« On dit que le mithril chuchote aux mineurs patients. Moi, je n’entends rien. Va écouter pour moi. »"
  outro: "Tu es revenu en jurant que le filon avait dit du bien de toi. Orvald n’a rien entendu, mais il a gardé le mithril."
