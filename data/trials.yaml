  nickname: "Salué par les nains"
  intro: "« Les nains ne saluent personne. Rapporte-moi de l’azurite et du sombracier, et on verra. »"
  outro: "Un nain a hoché la tête sur ton passage. Le village en parle encore, à voix basse."
  tasks:
