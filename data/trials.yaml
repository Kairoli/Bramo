# Épreuves des maîtres. À chaque palier de titre (Apprenti 30, Compagnon 60…), le maître du métier
# confie une épreuve : remettre des objets. La réussir donne le titre et un peu d'or.
# Personne n'est bloqué : le niveau continue de monter sans l'épreuve, seul le titre l'attend.
# Pour un métier d'artisanat, l'épreuve demande un chef-d'œuvre : une recette (trial: <id>)
# qui n'apparaît que pendant l'épreuve. Quantités et récompenses à équilibrer.

# --- Minage · Maître Orvald ---
- id: mining_apprentice
  profession: mining
  rank: 30
  name: Lire la roche
  intro: "« Un apprenti sait ce qu'il frappe. Rapporte-moi du fer et du charbon, et pas de la caillasse. »"
  tasks:
    - { item: iron_ore, qty: 60 }
    - { item: coal, qty: 30 }
  reward: { gold: 120 }

- id: mining_journeyman
  profession: mining
  rank: 60
  name: Le filon de mithril
  intro: "« Le mithril ne se laisse pas prendre par n'importe qui. Montre-moi que tu l'as trouvé. »"
  tasks:
    - { item: mithril_ore, qty: 80 }
    - { item: coal, qty: 60 }
  reward: { gold: 400 }

