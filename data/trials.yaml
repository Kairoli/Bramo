# Récompenses et quantités à équilibrer. # à équilibrer

# --- Maître Orvald (mining) ---
- id: mining_20
  profession: mining
  rank: 20
  name: "Les cailloux d’Orvald"
  nickname: "Gratteur de galeries"
  intro: "« Mes galeries ont besoin de fer et de charbon. Pas de la caillasse, pas des cailloux « jolis ». Du fer. »"
  outro: "Orvald a rangé ton chargement sans un mot, puis il a fait graver ton nom sur le plus petit casier de la mine. Chez lui, ça s’appelle de l’estime."
