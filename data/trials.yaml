  outro: "Les chênes disent qu’ils ont aimé ta conversation. Aldra a noté qu’ils n’ont pas dit « merci »."
  tasks:
    - { item: moonwood_log, qty: 270 }
    - { item: yew_log, qty: 300 }
  reward: { gold: 1500 }

- id: woodcutting_80
  profession: woodcutting
  rank: 80
  name: "Le malheur des castors"
  nickname: "Désespoir des castors"
  intro: "« Les castors se plaignent de la concurrence. Je ne vois pas de quoi ils parlent. Bien sûr que je les vois. »"
  outro: "Les castors ont déposé une plainte. Elle est restée sur une branche, faute de tribunal."
  tasks:
    - { item: moonwood_log, qty: 540 }
    - { item: ash_log, qty: 675 }
  reward: { gold: 3000 }

- id: woodcutting_99
  profession: woodcutting
  rank: 99
  name: "La forêt à lui seul"
  nickname: "La forêt à lui tout seul"
  intro: "« Dernière commande : toute une forêt, ou presque. Je ne demande pas où tu la caches. »"
  outro: "Aldra a replanté tout ce que tu as coupé. Les arbres t’ont reconnu et ont fait semblant de dormir."
  tasks:
    - { item: moonwood_log, qty: 1080 }
    - { item: yew_log, qty: 1200 }
  reward: { gold: 6000 }

