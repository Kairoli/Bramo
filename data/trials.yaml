# Rangs de métier : commandes du maître aux niveaux 20, 40, 60, 80 et 99 (docs/design/rangs.md).
# Réussir la commande accorde le surnom du palier et débloque la tranche suivante : sans elle, le niveau reste au palier
# (l'XP continue de s'accumuler, rien n'est perdu). Quantités = budget de travail par palier (30 min, 1 h 30, 3 h, 6 h, 12 h).
# Récompenses et quantités à équilibrer. # à équilibrer

# --- Maître Orvald (mining) ---
- id: mining_20
  profession: mining
  rank: 20
  name: "Les cailloux d’Orvald"
  nickname: "Gratteur de galeries"
  intro: "« Mes galeries ont besoin de fer et de charbon. Pas de la caillasse, pas des cailloux « jolis ». Du fer. »"
  outro: "Orvald a rangé ton chargement sans un mot, puis il a fait graver ton nom sur le plus petit casier de la mine. Chez lui, ça s’appelle de l’estime."
  tasks:
    - { item: iron_ore, qty: 65 }
    - { item: coal, qty: 55 }
  reward: { gold: 300 }

- id: mining_40
  profession: mining
  rank: 40
  name: "Le filon qui chuchote"
  nickname: "Chuchoteur de filons"
  intro: "« On dit que le mithril chuchote aux mineurs patients. Moi, je n’entends rien. Va écouter pour moi. »"
  outro: "Tu es revenu en jurant que le filon avait dit du bien de toi. Orvald n’a rien entendu, mais il a gardé le mithril."
  tasks:
    - { item: silver_ore, qty: 150 }
    - { item: mithril_ore, qty: 135 }
  reward: { gold: 800 }

- id: mining_60
  profession: mining
  rank: 60
  name: "L’éboulement de trop"
  nickname: "Fléau des éboulements"
  intro: "« Il y a eu un éboulement. Il y en a toujours. Rapporte-moi de quoi remplir le trou, de l’or et de l’orichalque. »"
  outro: "La galerie tient debout et Orvald jure que c’est grâce à toi. Les poutres préfèrent ne pas commenter."
  tasks:
    - { item: gold_ore, qty: 245 }
    - { item: orichalcum_ore, qty: 225 }
  reward: { gold: 1500 }

- id: mining_80
  profession: mining
  rank: 80
  name: "Le salut des nains"
  nickname: "Salué par les nains"
  intro: "« Les nains ne saluent personne. Rapporte-moi de l’azurite et du sombracier, et on verra. »"
  outro: "Un nain a hoché la tête sur ton passage. Le village en parle encore, à voix basse."
  tasks:
    - { item: azurite_ore, qty: 415 }
    - { item: umbral_ore, qty: 385 }
  reward: { gold: 3000 }

- id: mining_99
  profession: mining
  rank: 99
  name: "Le cœur de la montagne"
  nickname: "Cœur de la montagne"
  intro: "« Dernière commande. Je ne dirai pas ce que la montagne y gagne. Apporte-lui de l’astralite. »"
  outro: "La montagne a eu un petit tremblement de satisfaction. Orvald a pleuré, discrètement, dans un seau."
  tasks:
    - { item: umbral_ore, qty: 770 }
    - { item: astralite_ore, qty: 720 }
  reward: { gold: 6000 }

# --- Maîtresse Aldra (woodcutting) ---
- id: woodcutting_20
  profession: woodcutting
  rank: 20
  name: "Du bois pour l’hiver"
  nickname: "Collectionneur d’écorce"
  intro: "« L’hiver arrive et mon stock de chêne et de frêne est à sec. Je ne fais pas de feu avec de l’espoir. »"
  outro: "Aldra a compté les bûches trois fois, puis t’a offert un morceau d’écorce. Chez elle, c’est une médaille."
  tasks:
