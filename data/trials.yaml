    - { item: mithril_ore, qty: 135 }
  reward: { gold: 8000 }

- id: mining_60
  profession: mining
  rank: 60
  name: "L’éboulement de trop"
  nickname: "Fléau des éboulements"
  intro: "« Il y a eu un éboulement. Il y en a toujours. Rapporte-moi de quoi remplir le trou, de l’or et de l’orichalque. »"
  outro: "La galerie tient debout et Orvald jure que c’est grâce à toi. Les poutres préfèrent ne pas commenter."
  tasks:
    - { item: gold_ore, qty: 245 }
    - { item: orichalcum_ore, qty: 225 }
  reward: { gold: 15000 }

- id: mining_80
  profession: mining
  rank: 80
