# Bramo en production : base PostgreSQL (jamais exposée), serveur du jeu, Caddy (HTTPS automatique, client, /api), et une
# sauvegarde quotidienne de la base. Mode d'emploi : deploy/README.md. Rien ne s'expose tant qu'on ne lance pas ce fichier.
#   cp deploy/.env.example deploy/.env   (puis le remplir)
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bramo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans deploy/.env}
      POSTGRES_DB: bramo
    volumes:
      - bramo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bramo"]
      interval: 10s
      retries: 5

  app:
    image: bramo-app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bramo:${POSTGRES_PASSWORD}@postgres:5432/bramo
    depends_on:
      postgres:
        condition: service_healthy

  # Caddy obtient et renouvelle seul le certificat HTTPS du domaine (DOMAIN), sert le client et transmet /api au serveur.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?à définir dans deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web-dist:/srv/web:ro
      - caddy-data:/data
    depends_on:
      - app

  # Copie le client construit de l'image du jeu vers un volume lu par Caddy, à chaque démarrage.
  web:
    image: bramo-app
    depends_on:
      - app
    command: ["sh", "-c", "rm -rf /srv/web/* && cp -r /bramo/apps/web/dist/. /srv/web/"]
    user: root
    volumes:
      - web-dist:/srv/web

  # Sauvegarde : une copie de la base chaque nuit dans deploy/backups, les 14 dernières gardées.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h postgres -U bramo -d bramo -Fc -f /backups/bramo-$$(date +%Y%m%d-%H%M).dump
          ls -1t /backups/bramo-*.dump | tail -n +15 | xargs -r rm --
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  bramo-pg:
  caddy-data:
  web-dist:
