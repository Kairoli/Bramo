# Transformation et fabrication. Règle : XP = 1,75 × R(niveau) × durée / 3600 (l'artisan
# qui achète ses matériaux monte 1,75 fois plus vite qu'un récolteur de même niveau).
# `pnpm sim calibrate --write` recalcule l'XP depuis la durée : ne modifier que durées et quantités.
# Ingrédients transversaux volontairement de bas niveau (fil, lanières, rivets, manches, fioles) :
# un débutant du métier voisin les produit, et ils gardent un débouché toute la partie.
# Budgets visés (temps autonome, outils de base) : pièce d'équipement T1 15–50 min, T2 1–2 h ;
# outil de fer ≈ 40 min ; flèche ≈ 3 s ; repas : son bonus rapporte environ 2 fois son coût.

