# Variante de coherence-zones-v1 (docs/design/coherence/ §4.4) : seule la garde du Cloître change (900 → 420).
# Douze zones du PvE v2 (zones-v2), avec trois zones refaites par Claude pour Fracture et Battue (docs/design/coherence/).
# Loi mesurée (verification-claude.md §3) : avec PV × D^1,5 et dégâts × D, un cran demande ~+75 % de vitesse ou ~−43 % de
# dégâts subis. Un outil offensif ne gagne un cran que si ce qu'il contre est la source des dégâts. Donc :
#  - Cloître (Fracture) : tant que la garde tient, le chef frappe deux fois plus fort (empower 1) ; la garde suit le danger D
#    (pas D^1,5), elle reste une part fixe de l'effort ; briser la garde vite coupe la menace.
#  - Vergers (Battue) : les renforts portent l'essentiel des dégâts (trois par vague, trois vagues) ; le chef frappe peu.
#  - Atelier (Battue) : l'auxiliaire soigne beaucoup (5 × 700) et frappe ; le tuer vite raccourcit le combat de moitié.
# Les neuf autres zones sont celles de zones-v2, inchangées. Proposition, chiffres à équilibrer, rien d'adopté.
note: "Variante de coherence-zones-v1 : garde du Cloître à 420 (que le DPS normal perce presque). Non adoptée."
