# Proposition de combat (voir sim/README.md). addPlans est réécrit par `sim combat-search --write combat-voies-v1`.
note: "Équilibrage des voies, étape 3 de docs/design/coeur-du-jeu/integration.md. Proposé par Claude, à valider. 1) Passifs de dégâts faibles renforcés, eux seuls : Rebattue (Trempe-Rouge) 0,12 -> 0,22 P par Braise, Morsure (Tue-Bête) 0,42 -> 0,65 P. Fulgurant n'est pas touché : son retard venait des plans d'exemple. 2) Survie des voies de contrôle : leurs Affaiblissements de passif valent pour toutes les attaques de la cible pendant leur durée (plus seulement la prochaine), à valeur réduite ; leurs ralentissements +10 points et +50 % de durée. 3) Rupture des ennemis ordinaires (pas des boss) : Stabilité 50 au lieu de 80, étourdissement de 2 s. addPlans : plans conseillés trouvés par sim combat-search sur ces règles."
rules:
  stability:
    ordinaryMax: 50
    ordinaryBreakStun: 2
paths:
  red_temper:
    params:
      perHeat: 0.22
  beastslayer:
    params:
      bleed: 0.65
  anvil:
    params:
      weakenAll: 1
      weakenPerHeat: 0.06
      slowAmount: 0.1
      slowDuration: 1.5
  trapper:
    params:
      weakenAll: 1
      weaken: 0.2
      slowAmount: 0.1
      slowDuration: 1.5
  sigilbinder:
