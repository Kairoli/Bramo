# La Lanterne de dos (l'accessoire de dos et ses talents dans Legend of Mushroom) : chacun porte une lanterne contre la Marée.
# Elle monte de niveau (huile de lys, verre, or) ; tous les 10 niveaux, un choix entre deux talents de lanterne. Son apparence
# est un emplacement cosmétique (une boutique possible : apparence seulement, jamais de niveau). Ouverte au niveau 10.
id: lanterne
name: La Lanterne
kind: companion
text: "Une lanterne au dos : elle éclaire, elle réchauffe, et elle apprend en même temps que toi."
unlock: {classLevel: 10}
nodes:
  - {id: flamme, name: La Flamme, text: "+0,2 % de Puissance et de PV par niveau.", maxLevel: 50,
     cost: {gold: {base: 300, growth: 1.1}, items: [{item: lantern_lily, base: 3, growth: 1.08}, {item: glass_bead, base: 1, growth: 1.08}]},
     perLevel: [{stat: power, pct: 0.002}, {stat: maxHp, pct: 0.002}]}
  # Niveau 10 : un choix.
  - {id: meche_longue, name: Mèche longue, text: "Régénération : 0,15 % des PV par seconde.", choice: lanterne_10, requires: [{node: flamme, level: 10}],
     cost: {gold: {base: 5000}}, perLevel: [{stat: regen, flat: 0.0015}]}
  - {id: flamme_vive, name: Flamme vive, text: "+3 points de combo.", choice: lanterne_10, requires: [{node: flamme, level: 10}],
     cost: {gold: {base: 5000}}, perLevel: [{stat: combo, flat: 0.03}]}
  # Niveau 20 : un choix.
  - {id: verre_epais, name: Verre épais, text: "+3 points d'esquive.", choice: lanterne_20, requires: [{node: flamme, level: 20}],
     cost: {gold: {base: 15000}, items: [{item: artificer_lantern, base: 1}]}, perLevel: [{stat: evasion, flat: 0.03}]}
  - {id: halo, name: Le Halo, text: "+3 points de critique.", choice: lanterne_20, requires: [{node: flamme, level: 20}],
     cost: {gold: {base: 15000}, items: [{item: artificer_lantern, base: 1}]}, perLevel: [{stat: critChance, flat: 0.03}]}
  # Niveau 30 : un choix qui donne un talent.
  - id: fanal
    name: Le Fanal
    text: "Toutes les 8 s, ta lanterne frappe la cible (0,6 P)."
    choice: lanterne_30
    requires: [{node: flamme, level: 30}]
    cost: {gold: {base: 40000}, items: [{item: artificer_lantern, base: 2}]}
    talents: [{level: 1, talent: {id: lanterne_fanal, name: Le Fanal, effects: [{when: every, period: 8, do: {damage: 0.6}}]}}]
    force: 0.15
  - id: veilleuse
    name: La Veilleuse
    text: "Sous 40 % de tes PV, une fois par combat : soin de 0,8 P."
    choice: lanterne_30
    requires: [{node: flamme, level: 30}]
    cost: {gold: {base: 40000}, items: [{item: artificer_lantern, base: 2}]}
    talents: [{level: 1, talent: {id: lanterne_veilleuse, name: La Veilleuse, effects: [{when: hp_below, hpBelow: 0.4, cooldown: 999, do: {heal: {coef: 0.8}}}]}}]
    force: 0.15
