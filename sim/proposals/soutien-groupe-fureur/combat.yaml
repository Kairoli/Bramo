# [Proposé par Claude, essai] Plans de groupe des soutiens + fureur calée par rencontre : un groupe sans dégâts ne franchit plus tous les murs en prenant son temps.
note: Plans de groupe des soutiens et fureur de chaque rencontre à 1,1 fois le temps d'un groupe équilibré (+10 % de dégâts ennemis par seconde au-delà).
