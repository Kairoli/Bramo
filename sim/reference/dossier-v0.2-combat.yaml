# Règles du dossier « Le cœur du jeu » v0.2 (banc Python), à appliquer à data/combat/ pour comparer le moteur au banc.
# Même format qu'un combat.yaml de proposition. Remet les valeurs d'avant l'équilibrage du 22 octobre.
# Les recharges des sorts d'avant le rythme vif du 24 octobre (× 0,7 depuis dans data/) sont remises aussi.
# Le Traqueur réparé le 22 octobre (affût, purification, dissipation, sorts relevés) est aussi remis comme au dossier.
rules:
  stability:
    ordinaryMax: 80
    ordinaryBreakStun: 0
  enemy:
    onceWeakenTarget: next
classes:
  tracker: {params: {windowPierce: 0}}
