# Règles du dossier « Le cœur du jeu » v0.2 (banc Python), à appliquer à data/combat/ pour comparer le moteur au banc.
# Même format qu'un combat.yaml de proposition. Remet les valeurs d'avant l'équilibrage du 22 octobre.
# Le Traqueur réparé le 22 octobre (affût, purification, dissipation, sorts relevés) est aussi remis comme au dossier.
rules:
  stability:
    ordinaryMax: 80
    ordinaryBreakStun: 0
  enemy:
    onceWeakenTarget: next
classes:
  tracker: {params: {windowPierce: 0}}
paths:
  red_temper: {params: {perHeat: 0.12}}
  beastslayer: {params: {bleed: 0.42}}
  anvil: {params: {weakenPerHeat: 0.08, weakenAll: 0, slowAmount: 0, slowDuration: 1}}
  trapper: {params: {damage: 0.35, weaken: 0.25, weakenAll: 0, slowAmount: 0, slowDuration: 1}}
  sigilbinder: {params: {weaken: 0.30, weakenAll: 0, slowAmount: 0, slowDuration: 1}}
spells:
  tr_retreat: {cleanse: false}
  tr_stare: {dispel: false}
  tr_seam: {damage: 1.75}
  tr_sidestep: {damage: 1.9}
  tr_harass: {damage: 1.1}
